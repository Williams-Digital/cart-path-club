<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartPath Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
  <style>
    :root {
      --bg: #060F0A;
      --bg-card: #0D1F16;
      --bg-card-hover: #111F16;
      --bg-elevated: #142419;
      --gold: #BF9B3B;
      --gold-light: #CCAB52;
      --gold-dim: rgba(191, 155, 59, 0.15);
      --cream: #F5F0E1;
      --cream-muted: rgba(245, 240, 225, 0.5);
      --cream-dim: rgba(245, 240, 225, 0.25);
      --green-accent: #10352A;
      --green-accent2: #1A3F30;
      --green-ok: #4CAF50;
      --green-ok-dim: rgba(76, 175, 80, 0.15);
      --red: #E57373;
      --red-dim: rgba(229, 115, 115, 0.15);
      --amber: #F5A623;
      --amber-dim: rgba(245, 166, 35, 0.15);
      --border: rgba(245, 240, 225, 0.08);
      --border-light: rgba(245, 240, 225, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* LOGIN GATE */
    .login-gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .login-brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--cream);
      margin-bottom: 32px;
    }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--cream);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }

    .login-input:focus { border-color: var(--gold); }
    .login-input::placeholder { color: var(--cream-dim); }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover { background: var(--gold-light); }

    .login-error {
      color: var(--red);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* DASHBOARD */
    .dashboard { display: none; min-height: 100vh; }
    .dashboard.active { display: block; }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--gold);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-email {
      font-size: 12px;
      color: var(--cream-muted);
    }

    .new-app-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--gold);
      background: var(--gold-dim);
      padding: 6px 12px;
      border-radius: 20px;
      animation: pulse-gold 2s infinite;
    }

    .new-app-indicator.visible { display: flex; }

    @keyframes pulse-gold {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .new-app-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
    }

    .logout-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      color: var(--cream-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      color: var(--cream);
      border-color: var(--cream-dim);
    }

    /* Main Content */
    .main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 32px 64px;
    }

    /* Stats Row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cream-muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--cream);
      line-height: 1;
    }

    .stat-card.pending .stat-value { color: var(--gold); }
    .stat-card.approved .stat-value { color: var(--green-ok); }
    .stat-card.declined .stat-value { color: var(--cream-muted); }

    /* Tier Breakdown */
    .tier-breakdown {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tier-breakdown-label {
      font-size: 10px;
      color: var(--cream-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-right: 4px;
    }

    .tier-breakdown-badge {
      background: rgba(16, 53, 42, 0.5);
      border: 1px solid rgba(191, 155, 59, 0.08);
      border-radius: 4px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tier-breakdown-badge .tier-name {
      font-size: 11px;
      font-weight: 600;
    }

    .tier-breakdown-badge .tier-count {
      font-size: 14px;
      color: var(--cream);
      font-weight: 700;
    }

    /* Chart */
    .chart-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }

    .chart-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--cream-muted);
      margin-bottom: 16px;
    }

    .chart-container {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 100px;
      padding-top: 8px;
    }

    .chart-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .chart-bar {
      width: 100%;
      max-width: 40px;
      background: var(--gold);
      border-radius: 3px 3px 0 0;
      min-height: 2px;
      transition: height 0.3s ease;
      position: relative;
    }

    .chart-bar:hover {
      background: var(--gold-light);
    }

    .chart-bar-count {
      font-size: 9px;
      color: var(--cream-muted);
      text-align: center;
      line-height: 1;
    }

    .chart-bar-label {
      font-size: 9px;
      color: var(--cream-dim);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Search + Date Filters Row */
    .search-date-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--cream);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus { border-color: var(--gold); }
    .search-input::placeholder { color: var(--cream-dim); }

    .date-filter-group {
      display: flex;
      gap: 0;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      overflow: hidden;
    }

    .date-filter-btn {
      padding: 10px 16px;
      background: transparent;
      border: none;
      color: var(--cream-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      border-right: 1px solid var(--border-light);
    }

    .date-filter-btn:last-child { border-right: none; }

    .date-filter-btn.active {
      background: var(--gold-dim);
      color: var(--gold);
    }

    .date-filter-btn:hover:not(.active) {
      color: var(--cream);
    }

    /* Export Button */
    .export-btn {
      padding: 10px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--cream-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .export-btn:hover {
      color: var(--cream);
      border-color: var(--cream-dim);
    }

    .export-btn svg { width: 14px; height: 14px; }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }

    .filter-tab {
      padding: 10px 16px;
      background: none;
      border: none;
      color: var(--cream-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-tab:hover { color: var(--cream); }

    .filter-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .tab-badge {
      font-size: 11px;
      font-weight: 600;
      background: var(--border);
      color: var(--cream-muted);
      padding: 1px 7px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }

    .filter-tab.active .tab-badge {
      background: var(--gold-dim);
      color: var(--gold);
    }

    /* Table */
    .table-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .table-header {
      display: grid;
      grid-template-columns: 90px 1.2fr 1.1fr 110px 90px 100px 150px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--cream-dim);
    }

    .table-header > div {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .table-header > div:first-child {
      cursor: default;
    }

    .sort-arrow {
      font-size: 10px;
      opacity: 0.4;
      transition: opacity 0.2s;
    }

    .sort-arrow.active { opacity: 1; color: var(--gold); }

    .app-row {
      display: grid;
      grid-template-columns: 90px 1.2fr 1.1fr 110px 90px 100px 150px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .app-row:hover { background: var(--bg-card-hover); }
    .app-row:last-child { border-bottom: none; }
    .app-row.expanded { background: var(--bg-card-hover); border-bottom: none; }

    .row-checkbox {
      width: 16px;
      height: 16px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .cell-date {
      font-size: 13px;
      color: var(--cream-muted);
    }

    .cell-name { font-size: 14px; font-weight: 500; }
    .cell-email { font-size: 12px; color: var(--cream-muted); margin-top: 2px; }
    .cell-company { font-size: 14px; font-weight: 500; }
    .cell-title { font-size: 12px; color: var(--cream-muted); margin-top: 2px; }

    /* Tier Badges */
    .tier-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .tier-badge.founders { background: var(--gold-dim); color: var(--gold); }
    .tier-badge.chairmans { background: rgba(192,192,192,0.15); color: #C0C0C0; }
    .tier-badge.executive { background: var(--border); color: var(--cream-muted); }

    /* Status Badges */
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-badge.pending { background: var(--gold-dim); color: var(--gold); }
    .status-badge.approved { background: var(--green-ok-dim); color: var(--green-ok); }
    .status-badge.declined { background: var(--red-dim); color: var(--red); }
    .status-badge.removed { background: rgba(200,60,60,0.12); color: #E06060; }

    /* Email Status */
    .email-status {
      font-size: 11px;
      color: var(--cream-dim);
    }

    /* Payment Placeholder */
    .payment-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: var(--amber-dim);
      color: var(--amber);
    }

    /* Action Buttons */
    .action-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-approve {
      padding: 6px 12px;
      background: var(--green-ok-dim);
      color: var(--green-ok);
      border: 1px solid rgba(76,175,80,0.25);
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-approve:hover { background: var(--green-ok); color: #fff; }

    .btn-decline {
      padding: 6px 12px;
      background: transparent;
      color: var(--cream-muted);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-decline:hover {
      background: var(--red-dim);
      color: var(--red);
      border-color: rgba(229,115,115,0.25);
    }

    .btn-waive {
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(100,180,255,0.3);
      background: rgba(100,180,255,0.08);
      color: #7CB8F0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-waive:hover {
      background: rgba(100,180,255,0.15);
      border-color: rgba(100,180,255,0.5);
    }

    .btn-remove {
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(200,60,60,0.3);
      background: rgba(200,60,60,0.08);
      color: #E06060;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-remove:hover {
      background: rgba(200,60,60,0.15);
      border-color: rgba(200,60,60,0.5);
    }

    .btn-resend {
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(191,155,59,0.3);
      background: rgba(191,155,59,0.08);
      color: var(--gold);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-resend:hover {
      background: rgba(191,155,59,0.15);
      border-color: rgba(191,155,59,0.5);
    }

    .btn-resend:disabled, .btn-approve:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .detail-actions .btn-approve,
    .detail-actions .btn-decline,
    .detail-actions .btn-waive,
    .detail-actions .btn-remove,
    .detail-actions .btn-resend {
      padding: 10px 24px;
      font-size: 12px;
    }

    /* Expanded Row Detail */
    .app-detail {
      display: none;
      padding: 0 20px 20px;
      background: var(--bg-card-hover);
      border-bottom: 1px solid var(--border);
    }

    .app-detail.open { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 20px;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .detail-item label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cream-dim);
      margin-bottom: 4px;
    }

    .detail-item span {
      font-size: 14px;
      color: var(--cream);
    }

    /* Internal Notes */
    .notes-section {
      background: var(--bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .notes-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cream-dim);
      margin-bottom: 12px;
    }

    .notes-list {
      margin-bottom: 12px;
    }

    .note-entry {
      padding: 10px 12px;
      background: var(--bg-card);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--cream);
      line-height: 1.5;
    }

    .note-entry .note-time {
      font-size: 10px;
      color: var(--cream-dim);
      margin-bottom: 4px;
    }

    .note-textarea {
      width: 100%;
      min-height: 60px;
      background: var(--bg-card);
      color: var(--cream);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      outline: none;
      margin-bottom: 8px;
    }

    .note-textarea:focus { border-color: var(--gold); }
    .note-textarea::placeholder { color: var(--cream-dim); }

    .btn-save-note {
      padding: 8px 16px;
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid rgba(191,155,59,0.25);
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-save-note:hover {
      background: var(--gold);
      color: var(--bg);
    }

    /* Application Timeline */
    .timeline-section {
      background: var(--bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .timeline-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cream-dim);
      margin-bottom: 16px;
    }

    .timeline {
      display: flex;
      align-items: center;
      gap: 0;
      position: relative;
    }

    .timeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
      position: relative;
    }

    .timeline-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--border);
      border: 2px solid var(--border-light);
      z-index: 2;
      transition: all 0.2s;
    }

    .timeline-dot.completed {
      background: var(--gold);
      border-color: var(--gold);
    }

    .timeline-dot.active {
      background: var(--gold);
      border-color: var(--gold-light);
      box-shadow: 0 0 8px rgba(191,155,59,0.4);
    }

    .timeline-line {
      position: absolute;
      top: 6px;
      left: 50%;
      right: -50%;
      height: 2px;
      background: var(--border);
      z-index: 1;
    }

    .timeline-line.completed { background: var(--gold); }

    .timeline-step:last-child .timeline-line { display: none; }

    .timeline-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--cream-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timeline-label.completed { color: var(--gold); }

    .timeline-date {
      font-size: 9px;
      color: var(--cream-dim);
    }

    .detail-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Bulk Action Bar */
    .bulk-action-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 14px 24px;
      display: none;
      align-items: center;
      gap: 16px;
      z-index: 200;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .bulk-action-bar.visible { display: flex; }

    .bulk-count {
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      white-space: nowrap;
    }

    .bulk-approve-btn {
      padding: 8px 20px;
      background: var(--green-ok);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .bulk-approve-btn:hover { background: #66BB6A; }

    .bulk-decline-btn {
      padding: 8px 20px;
      background: var(--red-dim);
      color: var(--red);
      border: 1px solid rgba(229,115,115,0.25);
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .bulk-decline-btn:hover {
      background: var(--red);
      color: #fff;
    }

    .bulk-clear {
      font-size: 12px;
      color: var(--cream-muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: underline;
    }

    .bulk-clear:hover { color: var(--cream); }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--cream-muted);
    }

    .empty-state-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.3; }
    .empty-state-title { font-size: 16px; font-weight: 600; color: var(--cream); margin-bottom: 8px; }
    .empty-state-text { font-size: 13px; max-width: 400px; margin: 0 auto; line-height: 1.6; }

    /* Loading */
    .loading-wrap { text-align: center; padding: 64px 24px; }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 13px; color: var(--cream-muted); }

    /* Error */
    .error-wrap { text-align: center; padding: 48px 24px; }
    .error-msg { font-size: 14px; color: var(--red); margin-bottom: 16px; }

    .btn-retry {
      padding: 10px 24px;
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      color: var(--cream);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-retry:hover { border-color: var(--cream-dim); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
    }

    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }

    .modal-text {
      font-size: 14px;
      color: var(--cream-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .modal-reason-wrap {
      margin: 0 0 20px;
    }

    .modal-reason-label {
      display: block;
      font-size: 11px;
      color: var(--cream-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .modal-reason-textarea {
      width: 100%;
      min-height: 80px;
      background: var(--green-accent);
      color: var(--cream);
      border: 1px solid rgba(191,155,59,0.15);
      border-radius: 4px;
      padding: 12px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      outline: none;
    }

    .modal-reason-textarea:focus { border-color: var(--gold); }
    .modal-reason-textarea::placeholder { color: var(--cream-dim); }

    .modal-btns {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-cancel {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      color: var(--cream-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-cancel:hover { color: var(--cream); border-color: var(--cream-dim); }

    .modal-confirm {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-confirm.approve { background: var(--green-ok); color: #fff; }
    .modal-confirm.approve:hover { background: #66BB6A; }
    .modal-confirm.decline { background: var(--red); color: #fff; }
    .modal-confirm.decline:hover { background: #EF9A9A; }
    .modal-confirm.remove { background: #C03C3C; color: #fff; }
    .modal-confirm.remove:hover { background: #D04040; }
    .modal-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Luxury toast — unified across portals */
    .cp-toast-stack {
      position: fixed; top: 24px; right: 24px; z-index: 100000;
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none; max-width: calc(100vw - 48px);
    }
    .cp-toast {
      pointer-events: auto;
      position: relative; overflow: hidden;
      display: flex; align-items: flex-start; gap: 12px;
      min-width: 280px; max-width: 380px;
      padding: 14px 18px 14px 22px;
      background: rgba(9, 29, 20, 0.96);
      border: 1px solid rgba(191, 155, 59, 0.28);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.5),
        0 2px 10px rgba(191, 155, 59, 0.08),
        inset 0 1px 0 rgba(245, 240, 225, 0.04);
      animation: cp-toast-in 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
      font-family: 'Inter', sans-serif;
      color: var(--cream);
    }
    .cp-toast--out { animation: cp-toast-out 0.3s ease-in forwards; }
    @keyframes cp-toast-in { from { opacity: 0; transform: translateX(20px) scale(0.97); } to { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes cp-toast-out { to { opacity: 0; transform: translateX(20px) scale(0.97); } }
    .cp-toast__bar { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg, #CCAB52 0%, #A88630 100%); }
    .cp-toast--error .cp-toast__bar { background: linear-gradient(180deg, #E57373 0%, #C0392B 100%); }
    .cp-toast--info .cp-toast__bar { background: linear-gradient(180deg, #BF9B3B 0%, #7DB3D8 100%); }
    .cp-toast__icon {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
      background: rgba(191, 155, 59, 0.16); border: 1px solid rgba(191, 155, 59, 0.4); color: var(--gold);
    }
    .cp-toast--error .cp-toast__icon { background: rgba(229,115,115,0.14); border-color: rgba(229,115,115,0.45); color: #E57373; }
    .cp-toast--info .cp-toast__icon { background: rgba(125,179,216,0.14); border-color: rgba(125,179,216,0.45); color: #7DB3D8; }
    .cp-toast__body { flex: 1; min-width: 0; line-height: 1.4; }
    .cp-toast__title { font-size: 13px; font-weight: 600; color: var(--cream); }
    .cp-toast__sub { font-size: 12px; color: rgba(245, 240, 225, 0.55); margin-top: 3px; }
    .cp-toast__close { position: absolute; top: 6px; right: 8px; background: none; border: none; cursor: pointer; color: rgba(245,240,225,0.3); font-size: 18px; line-height: 1; padding: 4px 8px; transition: color 0.15s; }
    .cp-toast__close:hover { color: var(--gold); }
    .cp-toast__progress { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: rgba(245,240,225,0.04); }
    .cp-toast__progress-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #CCAB52, #A88630); transform-origin: left center; animation: cp-toast-progress linear forwards; }
    .cp-toast--error .cp-toast__progress-bar { background: linear-gradient(90deg, #E57373, #C0392B); }
    .cp-toast--info .cp-toast__progress-bar { background: linear-gradient(90deg, #BF9B3B, #7DB3D8); }
    @keyframes cp-toast-progress { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @media (max-width: 768px) {
      .cp-toast-stack { top: auto; bottom: 16px; right: 16px; left: 16px; max-width: none; align-items: stretch; }
      .cp-toast { min-width: 0; max-width: none; }
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .topbar { padding: 14px 16px; }
      .topbar-email { display: none; }
      .main { padding: 20px 16px 48px; }

      .stats-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat-card { padding: 16px; }
      .stat-value { font-size: 26px; }

      .search-date-row {
        flex-direction: column;
      }

      .date-filter-group { width: 100%; }
      .date-filter-btn { flex: 1; text-align: center; }

      .chart-container { height: 60px; }

      .filter-tabs {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .filter-tab {
        white-space: nowrap;
        padding: 10px 12px;
        font-size: 12px;
      }

      .table-header { display: none; }

      .app-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 16px;
      }

      .app-row .row-checkbox-wrap { order: 0; }
      .cell-date { order: 1; font-size: 12px; width: auto; }
      .cell-status-wrap { order: 2; margin-left: auto; }
      .cell-name-wrap { order: 3; width: 100%; }
      .cell-name { font-size: 15px; }
      .cell-company-wrap { order: 4; width: 100%; }
      .cell-tier-wrap { order: 5; }
      .cell-email-status { order: 6; }
      .cell-actions { order: 7; width: 100%; }

      .detail-grid {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 16px;
      }

      .detail-actions { flex-direction: column; }

      .timeline {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .timeline-step {
        flex-direction: row;
        gap: 12px;
      }

      .timeline-line {
        display: none;
      }

      .bulk-action-bar {
        left: 16px;
        right: 16px;
        transform: none;
        flex-wrap: wrap;
        justify-content: center;
      }

      .toast-container {
        left: 16px;
        right: 16px;
        bottom: 16px;
      }

      .toast { max-width: none; }
    }

    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- LOGIN GATE -->
  <div class="login-gate" id="loginGate">
    <div class="login-box">
      <div class="login-brand">CARTPATH ADMIN</div>
      <div class="login-title">Admin Dashboard</div>
      <form id="loginForm" onsubmit="return handleLogin(event)">
        <input type="email" class="login-input" id="emailInput" placeholder="Email" autocomplete="email" style="margin-bottom: 12px;">
        <input type="password" class="login-input" id="passwordInput" placeholder="Password" autocomplete="off">
        <button type="submit" class="login-btn">Access Dashboard</button>
      </form>
      <div class="login-error" id="loginError">Invalid email or password.</div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="topbar">
      <div class="topbar-brand">CARTPATH ADMIN</div>
      <div class="topbar-right">
        <div class="new-app-indicator" id="newAppIndicator">
          <div class="new-app-dot"></div>
          New application!
        </div>
        <span class="topbar-email" id="topbarEmail"></span>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
      </div>
    </div>

    <div class="main">
      <!-- Type Toggle: Members vs Athletes -->
      <div style="display: flex; gap: 0; margin-bottom: 24px; border: 1px solid var(--border-light); border-radius: 6px; overflow: hidden; width: fit-content;">
        <button id="toggleMembers" onclick="setAppType('members')" style="padding: 10px 28px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; background: var(--gold); color: var(--bg);">Members</button>
        <button id="toggleAthletes" onclick="setAppType('athletes')" style="padding: 10px 28px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; background: var(--bg-card); color: var(--cream-muted); border-left: 1px solid var(--border-light);">Athletes</button>
        <button id="toggleBookings" onclick="setAppType('bookings')" style="padding: 10px 28px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; background: var(--bg-card); color: var(--cream-muted); border-left: 1px solid var(--border-light);">Bookings</button>
        <button id="toggleRoster" onclick="setAppType('roster')" style="padding: 10px 28px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; background: var(--bg-card); color: var(--cream-muted); border-left: 1px solid var(--border-light);">Roster</button>
        <button id="toggleAvailability" onclick="setAppType('availability')" style="padding: 10px 28px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; background: var(--bg-card); color: var(--cream-muted); border-left: 1px solid var(--border-light);">Availability</button>
        <button id="toggleTimeline" onclick="setAppType('timeline')" style="padding: 10px 28px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; background: var(--bg-card); color: var(--cream-muted); border-left: 1px solid var(--border-light);">Timeline</button>
        <button id="toggleRevenue" onclick="setAppType('revenue')" style="padding: 10px 28px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; background: var(--bg-card); color: var(--cream-muted); border-left: 1px solid var(--border-light);">Revenue</button>
        <button id="toggleChurn" onclick="setAppType('churn')" style="padding: 10px 28px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; background: var(--bg-card); color: var(--cream-muted); border-left: 1px solid var(--border-light);">At Risk</button>
        <button id="toggleReviewsTab" onclick="setAppType('reviews')" style="padding: 10px 28px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; background: var(--bg-card); color: var(--cream-muted); border-left: 1px solid var(--border-light);">Reviews</button>
      </div>

      <!-- Stats -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <div class="stat-label">Total Applications</div>
          <div class="stat-value" id="statTotal">-</div>
        </div>
        <div class="stat-card pending" id="statPendingCard">
          <div class="stat-label">Pending Review</div>
          <div class="stat-value" id="statPending">-</div>
        </div>
        <div class="stat-card approved">
          <div class="stat-label">Approved</div>
          <div class="stat-value" id="statApproved">-</div>
        </div>
        <div class="stat-card declined">
          <div class="stat-label">Declined</div>
          <div class="stat-value" id="statDeclined">-</div>
        </div>
      </div>

      <!-- Tier Breakdown -->
      <div class="tier-breakdown" id="tierBreakdown" style="display:none;"></div>

      <!-- Chart -->
      <div class="chart-section" id="chartSection">
        <div class="chart-title">Applications -- Last 14 Days</div>
        <div class="chart-container" id="chartContainer"></div>
      </div>

      <!-- Search + Date Filters + Export -->
      <div class="search-date-row">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search by name, email, or company..." oninput="applyClientFilters()">
        </div>
        <div class="date-filter-group">
          <button class="date-filter-btn active" data-range="all" onclick="setDateFilter('all')">All Time</button>
          <button class="date-filter-btn" data-range="month" onclick="setDateFilter('month')">This Month</button>
          <button class="date-filter-btn" data-range="week" onclick="setDateFilter('week')">This Week</button>
        </div>
        <button class="export-btn" onclick="exportCSV()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">All <span class="tab-badge" id="badgeAll">0</span></button>
        <button class="filter-tab" data-filter="pending" onclick="setFilter('pending')">Pending <span class="tab-badge" id="badgePending">0</span></button>
        <button class="filter-tab" data-filter="approved" onclick="setFilter('approved')">Approved <span class="tab-badge" id="badgeApproved">0</span></button>
        <button class="filter-tab" data-filter="declined" onclick="setFilter('declined')">Declined <span class="tab-badge" id="badgeDeclined">0</span></button>
        <button class="filter-tab" data-filter="removed" onclick="setFilter('removed')">Removed <span class="tab-badge" id="badgeRemoved">0</span></button>
      </div>

      <!-- Content area -->
      <div id="contentArea">
        <div class="loading-wrap" id="loadingState">
          <div class="spinner"></div>
          <div class="loading-text">Loading applications...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- BULK ACTION BAR -->
  <div class="bulk-action-bar" id="bulkActionBar">
    <span class="bulk-count" id="bulkCount">0 selected</span>
    <button class="bulk-approve-btn" onclick="openBulkModal('approve')">Approve All</button>
    <button class="bulk-decline-btn" onclick="openBulkModal('decline')">Decline All</button>
    <button class="bulk-clear" onclick="clearSelection()">Clear Selection</button>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-text" id="modalText"></div>
      <div class="modal-reason-wrap" id="modalReasonWrap" style="display:none;">
        <label class="modal-reason-label" id="modalReasonLabel">Reason</label>
        <textarea class="modal-reason-textarea" id="modalReasonTextarea" placeholder=""></textarea>
      </div>
      <div class="modal-btns">
        <button class="modal-cancel" onclick="closeModal()">Cancel</button>
        <button class="modal-confirm" id="modalConfirm" onclick="confirmAction()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API = 'https://ha2sinzpu3.execute-api.us-east-1.amazonaws.com/prod';
    const ADMINS = {
      'dylan@williamsdigital.io': 'CartPath2026!',
      'dylan@cartpathclub.com': 'CartPath2026!',
      'msowell@cartpathclub.com': 'CartPath2026!'
    };

    let currentFilter = 'all';
    let currentDateFilter = 'all';
    let currentSort = { col: 'date', dir: 'desc' };
    let applications = [];
    let allApplications = [];
    let stats = { total: 0, pending: 0, approved: 0, declined: 0, removed: 0 };
    let expandedId = null;
    let pendingAction = null;
    let pollInterval = null;
    let lastTotal = null;
    let selectedIds = new Set();

    // ── App type toggle (members / athletes / bookings) ──
    let currentAppType = 'members';
    let athleteApplications = [];
    let allAthleteApplications = [];
    let allBookings = [];

    function setAppType(type) {
      currentAppType = type;
      expandedId = null;
      var btns = {
        members: document.getElementById('toggleMembers'),
        athletes: document.getElementById('toggleAthletes'),
        bookings: document.getElementById('toggleBookings'),
        roster: document.getElementById('toggleRoster'),
        availability: document.getElementById('toggleAvailability'),
        timeline: document.getElementById('toggleTimeline'),
        revenue: document.getElementById('toggleRevenue'),
        churn: document.getElementById('toggleChurn'),
        reviews: document.getElementById('toggleReviewsTab'),
      };
      Object.keys(btns).forEach(function(k) {
        if (btns[k]) {
          btns[k].style.background = 'var(--bg-card)';
          btns[k].style.color = 'var(--cream-muted)';
        }
      });
      if (btns[type]) {
        btns[type].style.background = 'var(--gold)';
        btns[type].style.color = 'var(--bg)';
      }

      // Show/hide stats, chart, filter tabs based on mode
      var statsRow = document.getElementById('statsRow');
      var chartSection = document.getElementById('chartSection');
      var filterTabs = document.getElementById('filterTabs');
      var searchDate = document.querySelector('.search-date-row');
      var hideExtraUI = (['bookings','roster','availability','timeline','revenue','churn','reviews'].indexOf(type) !== -1);
      if (statsRow) statsRow.style.display = hideExtraUI ? 'none' : '';
      if (chartSection) chartSection.style.display = hideExtraUI ? 'none' : '';
      if (filterTabs) filterTabs.style.display = hideExtraUI ? 'none' : '';
      if (searchDate) searchDate.style.display = hideExtraUI ? 'none' : '';

      if (type === 'bookings') {
        renderBookings();
      } else if (type === 'roster') {
        renderRoster();
      } else if (type === 'availability') {
        renderAvailability();
      } else if (type === 'timeline') {
        renderTimeline();
      } else if (type === 'revenue') {
        renderRevenue();
      } else if (type === 'churn') {
        renderChurn();
      } else if (type === 'reviews') {
        renderReviewsList();
      } else {
        applyClientFilters();
        updateStats();
      }
    }

    // ═════════════════════════════════════════════════════════════
    // TIMELINE — week-at-a-glance booking grid
    // ═════════════════════════════════════════════════════════════

    let timelineWeekStart = null;

    async function renderTimeline() {
      var area = document.getElementById('contentArea');
      area.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading timeline...</div></div>';

      if (!timelineWeekStart) {
        var d = new Date();
        d.setDate(d.getDate() - d.getDay()); // Sunday of this week
        timelineWeekStart = d.toISOString().slice(0, 10);
      }
      var from = timelineWeekStart;
      var toDate = new Date(timelineWeekStart + 'T12:00:00');
      toDate.setDate(toDate.getDate() + 13); // 2 weeks
      var to = toDate.toISOString().slice(0, 10);

      try {
        var res = await fetch(API + '/admin/timeline?from=' + from + '&to=' + to, {
          headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        if (!res.ok) throw new Error('Failed');
        var data = await res.json();
        var bookings = data.bookings || [];

        // Group by date
        var byDate = {};
        bookings.forEach(function(b) {
          var d = (b.preferred_date || '').slice(0, 10);
          (byDate[d] = byDate[d] || []).push(b);
        });

        var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">';
        html += '<div style="font-family:\'Playfair Display\',serif;font-size:1.6rem;color:var(--cream);">' + new Date(from + 'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'}) + ' — ' + new Date(to + 'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) + '</div>';
        html += '<div style="display:flex;gap:6px;">';
        html += '<button onclick="shiftTimeline(-7)" style="padding:7px 12px;background:none;border:1px solid var(--border-light);border-radius:4px;color:var(--cream);cursor:pointer;font-size:12px;">← Week</button>';
        html += '<button onclick="shiftTimeline(0)" style="padding:7px 12px;background:none;border:1px solid var(--gold);border-radius:4px;color:var(--gold);cursor:pointer;font-size:12px;">This Week</button>';
        html += '<button onclick="shiftTimeline(7)" style="padding:7px 12px;background:none;border:1px solid var(--border-light);border-radius:4px;color:var(--cream);cursor:pointer;font-size:12px;">Week →</button>';
        html += '</div></div>';

        // Day grid
        html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px;">';
        for (var i = 0; i < 14; i++) {
          var dt = new Date(from + 'T12:00:00');
          dt.setDate(dt.getDate() + i);
          var key = dt.toISOString().slice(0, 10);
          var dayBookings = byDate[key] || [];
          var dayLabel = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          var isToday = key === new Date().toISOString().slice(0, 10);
          html += '<div style="background:var(--bg-card);border:1px solid ' + (isToday ? 'var(--gold)' : 'var(--border-light)') + ';border-radius:6px;padding:10px;min-height:140px;">';
          html += '<div style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:' + (isToday ? 'var(--gold)' : 'var(--cream-muted)') + ';margin-bottom:8px;">' + dayLabel + '</div>';
          dayBookings.forEach(function(b) {
            var stateColor = ({
              completed: '#6DC86D', confirmed: 'var(--gold)', paid: '#7DB3D8',
              quoted: '#BF9B3B', awaiting_member_approval: '#BF9B3B', requested: 'var(--cream-muted)', pending_review: 'var(--cream-muted)',
            })[b.workflow_state] || 'var(--cream-muted)';
            html += '<div style="background:rgba(245,240,225,0.04);border-left:3px solid ' + stateColor + ';padding:6px 8px;margin-bottom:4px;border-radius:3px;font-size:11px;">';
            html += '<div style="color:var(--cream);font-weight:600;">' + esc(b.athlete_name || 'Athlete') + '</div>';
            html += '<div style="color:var(--cream-muted);font-size:10px;">w/ ' + esc(b.member_name || 'Member') + '</div>';
            html += '<div style="color:var(--cream-muted);font-size:10px;">' + esc(b.course || '') + '</div>';
            html += '</div>';
          });
          html += '</div>';
        }
        html += '</div>';

        // Legend
        html += '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--cream-muted);padding-top:8px;border-top:1px solid var(--border-light);">';
        html += '<div><span style="display:inline-block;width:12px;height:12px;background:#6DC86D;vertical-align:middle;border-radius:2px;margin-right:5px;"></span>Completed</div>';
        html += '<div><span style="display:inline-block;width:12px;height:12px;background:var(--gold);vertical-align:middle;border-radius:2px;margin-right:5px;"></span>Confirmed</div>';
        html += '<div><span style="display:inline-block;width:12px;height:12px;background:#7DB3D8;vertical-align:middle;border-radius:2px;margin-right:5px;"></span>Paid</div>';
        html += '<div><span style="display:inline-block;width:12px;height:12px;background:var(--cream-muted);vertical-align:middle;border-radius:2px;margin-right:5px;"></span>Other</div>';
        html += '</div>';

        area.innerHTML = html;
      } catch (err) {
        area.innerHTML = '<div class="empty-state"><div class="empty-state-icon">!</div><div class="empty-state-title">Unable to load</div></div>';
      }
    }

    function shiftTimeline(deltaDays) {
      if (deltaDays === 0) {
        timelineWeekStart = null;
      } else {
        var d = new Date(timelineWeekStart + 'T12:00:00');
        d.setDate(d.getDate() + deltaDays);
        timelineWeekStart = d.toISOString().slice(0, 10);
      }
      renderTimeline();
    }

    function esc(s) { var d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }
    function fmtDollars(c) { return '$' + Math.floor(Number(c || 0) / 100).toLocaleString('en-US'); }

    // ═════════════════════════════════════════════════════════════
    // AVAILABILITY — combined calendar of all athletes' open/blocked
    // dates for the next 30 days. Mayo uses this when reviewing booking
    // requests so they can see at a glance who's open on a given day.
    // ═════════════════════════════════════════════════════════════

    let availabilityRangeDays = 30;

    async function renderAvailability() {
      var area = document.getElementById('contentArea');
      area.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading availability...</div></div>';

      var now = new Date();
      var from = now.toISOString().slice(0, 10);
      var to = new Date(now.getTime() + availabilityRangeDays * 86400000).toISOString().slice(0, 10);

      try {
        var res = await fetch(API + '/admin/availability?from=' + from + '&to=' + to, {
          headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        if (!res.ok) throw new Error('Failed to load availability');
        var data = await res.json();
        var entries = data.availability || [];
        renderAvailabilityGrid(entries, from, to);
      } catch (err) {
        area.innerHTML = '<div class="empty-state"><div class="empty-state-icon">!</div><div class="empty-state-title">Unable to load</div><div class="empty-state-text">' + (err.message || 'Try again') + '</div></div>';
      }
    }

    function renderAvailabilityGrid(entries, fromIso, toIso) {
      var area = document.getElementById('contentArea');

      // Build a list of dates in range
      var fromDate = new Date(fromIso + 'T12:00:00');
      var toDate = new Date(toIso + 'T12:00:00');
      var days = [];
      var d = new Date(fromDate);
      while (d <= toDate) {
        days.push(d.toISOString().slice(0, 10));
        d = new Date(d.getTime() + 86400000);
      }

      // Group entries by athlete
      var byAthlete = {};
      entries.forEach(function(e) {
        var key = e.athlete_id;
        if (!byAthlete[key]) {
          byAthlete[key] = { name: e.athlete_name, sport: e.sport, entries: [] };
        }
        byAthlete[key].entries.push(e);
      });

      var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">';
      html += '<div><h2 style="font-family:Inter,sans-serif;font-size:1.5rem;font-weight:600;color:var(--cream);margin:0 0 4px;">Athlete Availability</h2>';
      html += '<p style="font-family:Inter,sans-serif;font-size:13px;color:var(--cream-muted);margin:0;">Next ' + availabilityRangeDays + ' days &middot; only visible to admins</p></div>';
      html += '<div style="display:flex;gap:6px;">';
      html += '<button onclick="setAvailRange(14)" class="avail-range-btn" data-r="14" style="padding:7px 14px;background:' + (availabilityRangeDays===14?'rgba(191,155,59,0.15)':'transparent') + ';border:1px solid ' + (availabilityRangeDays===14?'var(--gold)':'var(--border-light)') + ';color:' + (availabilityRangeDays===14?'var(--gold)':'var(--cream-muted)') + ';font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;border-radius:4px;cursor:pointer;">2 Weeks</button>';
      html += '<button onclick="setAvailRange(30)" class="avail-range-btn" data-r="30" style="padding:7px 14px;background:' + (availabilityRangeDays===30?'rgba(191,155,59,0.15)':'transparent') + ';border:1px solid ' + (availabilityRangeDays===30?'var(--gold)':'var(--border-light)') + ';color:' + (availabilityRangeDays===30?'var(--gold)':'var(--cream-muted)') + ';font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;border-radius:4px;cursor:pointer;">30 Days</button>';
      html += '<button onclick="setAvailRange(60)" class="avail-range-btn" data-r="60" style="padding:7px 14px;background:' + (availabilityRangeDays===60?'rgba(191,155,59,0.15)':'transparent') + ';border:1px solid ' + (availabilityRangeDays===60?'var(--gold)':'var(--border-light)') + ';color:' + (availabilityRangeDays===60?'var(--gold)':'var(--cream-muted)') + ';font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;border-radius:4px;cursor:pointer;">60 Days</button>';
      html += '</div></div>';

      // Legend
      html += '<div style="display:flex;gap:16px;margin-bottom:18px;font-family:Inter,sans-serif;font-size:12px;color:var(--cream-muted);">';
      html += '<span><span style="display:inline-block;width:10px;height:10px;background:#2D8A56;border-radius:2px;margin-right:6px;vertical-align:middle;"></span>Open</span>';
      html += '<span><span style="display:inline-block;width:10px;height:10px;background:#C0392B;border-radius:2px;margin-right:6px;vertical-align:middle;"></span>Blocked</span>';
      html += '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(191,155,59,0.15);border:1px solid rgba(191,155,59,0.4);border-radius:2px;margin-right:6px;vertical-align:middle;"></span>Today</span>';
      html += '</div>';

      var athleteIds = Object.keys(byAthlete);
      if (athleteIds.length === 0) {
        html += '<div class="empty-state"><div class="empty-state-icon">&#128197;</div><div class="empty-state-title">No availability set</div><div class="empty-state-text">No athletes have set availability in this date range. Athletes manage their own calendars in the athlete portal.</div></div>';
        area.innerHTML = html;
        return;
      }

      // Day headers (compact)
      var todayStr = new Date().toISOString().slice(0, 10);
      var dayCol = '40px';
      html += '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);">';
      html += '<div style="display:grid;grid-template-columns:200px repeat(' + days.length + ',' + dayCol + ');min-width:max-content;">';

      // Header row
      html += '<div style="padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg-elevated);font-family:Inter,sans-serif;font-size:11px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;position:sticky;left:0;z-index:2;">Athlete</div>';
      days.forEach(function(dStr) {
        var dt = new Date(dStr + 'T12:00:00');
        var isToday = dStr === todayStr;
        var isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
        html += '<div style="padding:8px 4px;text-align:center;border-bottom:1px solid var(--border);border-left:1px solid var(--border);background:' + (isToday ? 'rgba(191,155,59,0.08)' : 'var(--bg-elevated)') + ';font-family:Inter,sans-serif;font-size:9px;color:' + (isToday ? 'var(--gold)' : (isWeekend ? 'var(--cream-muted)' : 'var(--cream-dim)')) + ';">';
        html += '<div style="font-weight:600;">' + ['SUN','MON','TUE','WED','THU','FRI','SAT'][dt.getDay()] + '</div>';

      });

      // Per-athlete rows
      athleteIds.forEach(function(aid) {

        html += '<div style="font-family:Inter,sans-serif;font-size:13px;color:var(--cream);font-weight:600;">' + escapeHtml(ath.name) + '</div>';

          html += '<div style="font-family:Inter,sans-serif;font-size:11px;color:var(--cream-muted);margin-top:2px;">' + escapeHtml(ath.sport) + '</div>';
        }
        html += '</div>';
        days.forEach(function(dStr) {
          var hasOpen = false, hasBlocked = false, notes = [];
          ath.entries.forEach(function(e) {
            var s = e.start_date.substring(0, 10);
            var en = e.end_date.substring(0, 10);
            if (dStr >= s && dStr <= en) {
              if (e.type === 'open') hasOpen = true;
              if (e.type === 'blocked') hasBlocked = true;
              if (e.notes) notes.push(e.notes);
            }
          });
          var bg = '';
          if (hasOpen && hasBlocked) bg = 'background:linear-gradient(135deg,#2D8A56 50%,#C0392B 50%);';
          else if (hasOpen) bg = 'background:#2D8A56;';
          else if (hasBlocked) bg = 'background:#C0392B;';

          var title = notes.length > 0 ? ' title="' + escapeAttr(notes.join(' / ')) + '"' : '';
          html += '<div' + title + ' style="border-bottom:1px solid var(--border);border-left:1px solid var(--border);min-height:42px;' + bg + '"></div>';
        });
      });

      html += '</div></div>';
      area.innerHTML = html;

    async function handleRosterPhotoSelect(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      var status = document.getElementById('rosterPhotoStatus');
      if (file.size > 8 * 1024 * 1024) {
        status.textContent = 'Image too large (max 8MB)';
        status.style.color = '#E57373';
        return;
      }
      status.textContent = 'Uploading...';
      status.style.color = 'var(--gold)';

      try {
        // Get presigned URL
        var presignRes = await fetch(API + '/admin/roster/photo-upload-url', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
          body: JSON.stringify({
            athlete_id: editingRosterAthleteId,
            filename: file.name,
            content_type: file.type
          })
        });
        if (!presignRes.ok) throw new Error('Failed to get upload URL');
        var presignData = await presignRes.json();

        // Upload to S3
        var uploadRes = await fetch(presignData.upload_url, {
          method: 'PUT',
          headers: { 'Content-Type': file.type },
          body: file
        });
        if (!uploadRes.ok) throw new Error('Upload failed');

        pendingPhotoUrl = presignData.public_url;
        status.textContent = 'Uploaded';
        status.style.color = '#6DC86D';

        // Show preview
        var ph = document.getElementById('rosterPhotoPlaceholder');
        if (ph) {
          ph.outerHTML = '<div style="margin-bottom:14px;"><img src="' + presignData.public_url + '" id="rosterPhotoPreview" style="width:100%;max-height:240px;object-fit:cover;border-radius:6px;border:1px solid var(--border-light);"></div>';
        } else {
          var preview = document.getElementById('rosterPhotoPreview');
          if (preview) preview.src = presignData.public_url;
        }
      } catch (err) {
        status.textContent = 'Upload failed: ' + err.message;
        status.style.color = '#E57373';
      }
    }

    async function saveRosterAthlete() {
      var name = document.getElementById('rosterName').value.trim();
      var sport = document.getElementById('rosterSport').value.trim();
      if (!name || !sport) { showToast('Name and sport are required', 'error'); return; }

      var existing = editingRosterAthleteId
        ? allRosterAthletes.find(function(a) { return a.id === editingRosterAthleteId; })
        : null;

      var payload = {
        name: name,
        sport: sport,
        school: document.getElementById('rosterSchool').value.trim() || null,
        story: document.getElementById('rosterStory').value.trim() || null,
        price_min: parseInt(document.getElementById('rosterPriceMin').value) || 0,
        price_max: parseInt(document.getElementById('rosterPriceMax').value) || 0,
        handicap: document.getElementById('rosterHandicap').value.trim() || null,
        type: document.getElementById('rosterType').value,
        listing_status: document.getElementById('rosterStatus').value,
      };
      if (pendingPhotoUrl) payload.photo_url = pendingPhotoUrl;

      try {
        var url = API + '/admin/roster' + (editingRosterAthleteId ? '/' + editingRosterAthleteId : '');
        var method = editingRosterAthleteId ? 'PATCH' : 'POST';
        var res = await fetch(url, {
          method: method,
          headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          throw new Error(err.error || 'Save failed');
        }
        closeModal();
        showToast(editingRosterAthleteId ? 'Athlete updated' : 'Athlete added to roster');
        await renderRoster();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    async function deleteRosterAthlete(id, name) {
      if (!confirm('Delete ' + name + ' from the roster? This cannot be undone.')) return;
      try {
        var res = await fetch(API + '/admin/roster/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          throw new Error(err.error || 'Delete failed');
        }
        showToast(name + ' removed');
        await renderRoster();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

        var preferred = b.preferred_date ? new Date(b.preferred_date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '--';
        var state = b.workflow_state || 'requested';
        var stateLabel = ({
          requested: 'New Request', pending_review: 'Ready to Forward', awaiting_member: 'Awaiting Member',
          pending_athlete: 'Athlete Reviewing',
          accepted_by_athlete: 'Athlete Accepted — Quote',
          athlete_declined: 'Athlete Declined',
          awaiting_member_approval: 'Member Approval', price_rejected: 'Price Rejected',
          quoted: 'Awaiting Payment', paid: 'Paid', confirmed: 'Confirmed',
          completed: 'Completed', declined: 'Declined', cancelled: 'Cancelled',
        })[state] || state;

        var stateColor = (['paid','confirmed','completed','accepted_by_athlete'].includes(state)) ? 'approved' :
                        (['declined','cancelled','price_rejected','athlete_declined'].includes(state)) ? 'declined' :
                        'pending';

        html += '<div class="app-row" style="grid-template-columns: 90px 1.2fr 1.1fr 130px 160px 120px 140px; cursor:default;">';
        html += '<div class="cell-date">' + escapeHtml(created) + '</div>';

        html += '<div style="font-size:13px;color:var(--cream);">' + escapeHtml(preferred) + '</div>';
        html += '<div style="font-size:12px;color:var(--cream-muted);">' + escapeHtml(b.course || '--') + '</div>';
        html += '<div><span class="status-badge ' + stateColor + '" style="font-size:10px;">' + stateLabel + '</span></div>';

          html += '<button class="btn-approve" onclick="forwardToAthlete(\'' + escapeAttr(b.id) + '\')">Forward to Athlete</button>';
        } else if (state === 'pending_athlete') {
          html += '<span style="font-size:10px;color:var(--amber);opacity:0.8;">Athlete reviewing</span>';
        } else if (state === 'accepted_by_athlete' || state === 'price_rejected') {

          html += '<button class="btn-approve" onclick="rerouteAfterDecline(\'' + escapeAttr(b.id) + '\')" style="background:#7DB3D8;">Reroute</button>';

          html += '<span style="font-size:10px;color:var(--amber);opacity:0.8;">Awaiting $ approval</span>';

          html += '<span style="font-size:10px;color:var(--amber);opacity:0.8;">Awaiting payment</span>';
        } else if (state === 'paid') {
          html += '<button class="btn-approve" onclick="confirmBookingAction(\'' + escapeAttr(b.id) + '\', \'confirm\')">Confirm</button>';
        } else if (state === 'confirmed') {

    async function submitQuote(bookingId) {
      var price = parseInt(document.getElementById('bookingQuotePrice').value);
      var notes = document.getElementById('bookingQuoteNotes').value.trim();
      if (!price || price < 100) { showToast('Please enter a valid price', 'error'); return; }
      closeModal();

      try {
        var res = await fetch(API + '/admin/bookings/' + bookingId + '/quote', {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ quoted_amount_cents: price * 100, notes: notes || null })
        });
        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          throw new Error(err.error || 'Quote failed');
        }
        showToast('Quote sent! Member will approve before payment link is sent.');
        await renderBookings();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    async function confirmBookingAction(bookingId, action) {
      if (action === 'decline') {
        var reason = prompt('Decline reason (optional, internal-only):');
        if (reason === null) return; // cancelled
        try {
          var res = await fetch(API + '/admin/bookings/' + bookingId + '/decline', {
            method: 'PATCH',
            headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: reason || null }),
          });
          if (!res.ok) throw new Error('Decline failed');
          showToast('Booking declined');
          await renderBookings();
        } catch (err) {
          showToast('Error: ' + err.message, 'error');
        }
        return;
      }
      if (!confirm('Confirm this action?')) return;
      try {
        var res = await fetch(API + '/admin/bookings/' + bookingId + '/' + action, {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        if (!res.ok) throw new Error('Action failed');
        showToast('Booking updated');
        await renderBookings();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    async function forwardToAthlete(bookingId) {
      var booking = allBookings.find(function(b) { return b.id === bookingId; });
      var athleteName = booking ? (booking.athlete_name || 'the athlete') : 'the athlete';
      if (!confirm('Forward this request to ' + athleteName + ' for their approval?\n\nThey will receive an email + push notification with the request details.')) return;
      try {
        var res = await fetch(API + '/admin/bookings/' + bookingId + '/forward-to-athlete', {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ forwarded_by: getEmail() || 'admin' }),
        });
        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          throw new Error(err.error || 'Forward failed');
        }
        showToast('Forwarded to ' + athleteName);
        await renderBookings();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');

    async function rerouteAfterDecline(bookingId) {
      var newAthleteId = prompt('Reroute to a different athlete? Paste their athlete ID, or leave blank to retry the same athlete:');
      if (newAthleteId === null) return; // cancelled

        });

          var err = await res.json().catch(function() { return {}; });
          throw new Error(err.error || 'Reroute failed');
        }

      } catch (err) {
        showToast('Error: ' + err.message, 'error');
