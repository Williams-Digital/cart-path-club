<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#091D14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>CartPath — Assistant</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/cartpath-shield.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--green-deep:#091D14;--green-dark:#10352A;--green-mid:#1A3F30;--gold:#BF9B3B;--gold-dark:#A88630;--cream:#F5F0E1;--cream-muted:rgba(245,240,225,0.55);--error:#E57373;--font-display:'Playfair Display',Georgia,serif;--font-ui:'Inter',-apple-system,sans-serif;}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html{height:100%;}
    body{background:var(--green-deep);color:var(--cream);font-family:var(--font-ui);min-height:100vh;min-height:100dvh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom);}
    .header{position:sticky;top:0;z-index:10;background:rgba(9,29,20,0.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(191,155,59,0.16);padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .brand{display:flex;align-items:center;gap:10px;}
    .brand img{width:30px;height:30px;}
    .brand .wm{font-family:var(--font-display);font-size:14px;letter-spacing:0.3em;color:var(--gold);padding-left:0.3em;}
    .role-pill{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(191,155,59,0.3);border-radius:20px;padding:3px 9px;margin-left:4px;}
    .signout{background:transparent;border:1px solid rgba(191,155,59,0.3);border-radius:7px;color:var(--gold);font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:7px 12px;cursor:pointer;}
    .main{max-width:560px;margin:0 auto;padding:22px 18px 60px;}
    .acting{font-size:13px;color:var(--cream-muted);margin-bottom:22px;line-height:1.5;}
    .acting strong{color:var(--gold);}
    .card{background:rgba(16,53,42,0.4);border:1px solid rgba(191,155,59,0.16);border-radius:14px;padding:22px 18px;margin-bottom:18px;}
    .card h2{font-family:var(--font-display);font-size:19px;font-weight:500;margin-bottom:4px;}
    .card .desc{font-size:12.5px;color:var(--cream-muted);margin-bottom:16px;line-height:1.5;}
    .field{margin-bottom:13px;}
    .field label{display:block;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:7px;}
    .field input,.field select,.field textarea{width:100%;background:rgba(9,29,20,0.55);border:1px solid rgba(191,155,59,0.18);border-radius:8px;padding:12px 13px;color:var(--cream);font-family:var(--font-ui);font-size:16px;outline:none;-webkit-appearance:none;}
    .field textarea{min-height:70px;resize:vertical;}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
    .btn{width:100%;padding:14px 16px;background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:var(--green-deep);border:none;border-radius:8px;font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;margin-top:6px;}
    .btn:active{transform:translateY(1px);}
    .btn:disabled{opacity:0.55;cursor:not-allowed;}
    .msg{display:none;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:13px;}
    .msg.error{display:block;background:rgba(229,115,115,0.08);border:1px solid rgba(229,115,115,0.3);color:var(--error);}
    .msg.ok{display:block;background:rgba(191,155,59,0.08);border:1px solid rgba(191,155,59,0.3);color:var(--gold);}
    .req{border:1px solid rgba(191,155,59,0.14);border-radius:10px;padding:13px 14px;margin-bottom:10px;background:rgba(9,29,20,0.4);}
    .req .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px;}
    .req .ath{font-family:var(--font-display);font-size:15px;color:var(--cream);}
    .req .status{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap;}
    .st-pending{color:var(--gold);border:1px solid rgba(191,155,59,0.4);}
    .st-approved,.st-confirmed,.st-completed{color:#6DC86D;border:1px solid rgba(109,200,109,0.4);}
    .st-declined,.st-cancelled{color:var(--error);border:1px solid rgba(229,115,115,0.4);}
    .req .meta{font-size:12px;color:var(--cream-muted);line-height:1.5;}
    .empty{text-align:center;color:rgba(245,240,225,0.35);font-size:13px;padding:24px 0;}
    .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(9,29,20,0.3);border-top-color:var(--green-deep);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-full{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--cream-muted);font-size:14px;}
  </style>
</head>
<body>
  <div id="bootView" class="loading-full">Loading…</div>

  <div id="appView" style="display:none;">
    <header class="header">
      <div class="brand">
        <img src="/assets/cartpath-shield.png" alt="CartPath">
        <span class="wm">CARTPATH</span>
        <span class="role-pill">Assistant</span>
      </div>
      <button class="signout" onclick="signOut()">Sign Out</button>
    </header>

    <div class="main">
      <div class="acting" id="actingLine"></div>

      <!-- Submit a round request -->
      <div class="card">
        <h2>Request a Round</h2>
        <div class="desc">Submit a round request on behalf of your member. Our concierge team reviews every request.</div>
        <div class="msg" id="reqMsg"></div>
        <div class="field">
          <label for="athlete">Athlete</label>
          <select id="athlete"><option value="">Loading roster…</option></select>
        </div>
        <div class="row2">
          <div class="field">
            <label for="date">Preferred Date</label>
            <input type="date" id="date">
          </div>
          <div class="field">
            <label for="group">Group Size</label>
            <select id="group"><option>1</option><option>2</option><option selected>3</option><option>4</option></select>
          </div>
        </div>
        <div class="field">
          <label for="course">Course</label>
          <input type="text" id="course" placeholder="e.g. East Lake Golf Club">
        </div>
        <div class="field">
          <label for="notes">Notes for the concierge</label>
          <textarea id="notes" placeholder="Anything the team should know…"></textarea>
        </div>
        <button class="btn" id="submitBtn" type="button">Send Request</button>
      </div>

      <!-- Existing requests -->
      <div class="card">
        <h2>Requests</h2>
        <div class="desc">Round requests for your member.</div>
        <div id="reqList"><div class="empty">Loading…</div></div>
      </div>
    </div>
  </div>

  <script>
    var API_BASE = 'https://ha2sinzpu3.execute-api.us-east-1.amazonaws.com/prod';
    var SK = { id:'cp_id_token', access:'cp_access_token', refresh:'cp_refresh_token', expiry:'cp_token_expiry', email:'cp_email' };

    // ── Token handoff from /app/login (#-hash), same pattern as the member portal ──
    (function bootstrap(){
      try{
        if(window.location.hash && window.location.hash.length>1){
          var p = JSON.parse(decodeURIComponent(window.location.hash.substring(1)));
          if(p && p.id_token){
            localStorage.setItem(SK.id, p.id_token);
            localStorage.setItem(SK.access, p.access_token||'');
            if(p.refresh_token) localStorage.setItem(SK.refresh, p.refresh_token);
            if(p.token_expiry) localStorage.setItem(SK.expiry, p.token_expiry);
            if(p.email) localStorage.setItem(SK.email, p.email);
            history.replaceState(null,'',window.location.pathname);
          }
        }
      }catch(e){}
    })();

    function token(){ return localStorage.getItem(SK.id) || ''; }
    function authHeaders(extra){ var h={'Authorization':'Bearer '+token()}; if(extra) for(var k in extra) h[k]=extra[k]; return h; }
    function signOut(){ [SK.id,SK.access,SK.refresh,SK.expiry,SK.email].forEach(function(k){localStorage.removeItem(k);}); window.location.replace('/app/login'); }
    function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    function bootError(){ window.location.replace('/app/login'); }

    // ── Confirm the caller is an active assistant, then load the portal ──
    function init(){
      if(!token()){ bootError(); return; }
      fetch(API_BASE + '/auth/whoami', { headers: authHeaders() })
        .then(function(r){ if(!r.ok) throw new Error('whoami'); return r.json(); })
        .then(function(me){
          var roles = me.roles || [];
          if(roles.indexOf('assistant') === -1){
            // Not an assistant — send them to their proper home.
            window.location.replace(me.default_route || '/app/login');
            return;
          }
          document.getElementById('actingLine').innerHTML = 'Signed in as <strong>' + escapeHtml(me.name || me.email || 'Assistant') + '</strong> — acting on behalf of your member.';
          document.getElementById('bootView').style.display='none';
          document.getElementById('appView').style.display='block';
          loadRoster();
          loadRequests();
        })
        .catch(function(){ bootError(); });
    }

    // ── Roster (athletes the member can request) ──
    function loadRoster(){
      fetch(API_BASE + '/athletes/roster', { headers: authHeaders() })
        .then(function(r){ return r.ok ? r.json() : []; })
        .then(function(data){
          var list = Array.isArray(data) ? data : (data.athletes || data.roster || []);
          var sel = document.getElementById('athlete');
          if(!list.length){ sel.innerHTML = '<option value="">No athletes available</option>'; return; }
          sel.innerHTML = '<option value="">Select an athlete…</option>' + list.map(function(a){
            return '<option value="'+escapeHtml(a.id||'')+'" data-name="'+escapeHtml(a.name||'')+'">'+escapeHtml(a.name||'Athlete')+'</option>';
          }).join('');
        })
        .catch(function(){ document.getElementById('athlete').innerHTML='<option value="">Couldn’t load roster</option>'; });
    }

    // ── Submit a booking request (backend treats assistant as the member) ──
    function submitRequest(){
      var msg = document.getElementById('reqMsg'); msg.className='msg'; msg.style.display='none';
      var sel = document.getElementById('athlete');
      var athleteId = sel.value;
      var athleteName = sel.options[sel.selectedIndex] ? (sel.options[sel.selectedIndex].getAttribute('data-name')||'') : '';
      var date = document.getElementById('date').value;
      var course = document.getElementById('course').value.trim();
      var group = document.getElementById('group').value;
      var notes = document.getElementById('notes').value.trim();
      if(!athleteId){ msg.textContent='Please choose an athlete.'; msg.className='msg error'; msg.style.display='block'; return; }
      if(!date || !course){ msg.textContent='Please add a date and course.'; msg.className='msg error'; msg.style.display='block'; return; }

      var btn = document.getElementById('submitBtn');
      btn.disabled=true; btn.innerHTML='<span class="spin"></span>Sending…';
      fetch(API_BASE + '/bookings', {
        method:'POST', headers: authHeaders({'Content-Type':'application/json'}),
        body: JSON.stringify({
          athlete_id: athleteId, athlete_name: athleteName,
          preferred_date: date, course: course,
          group_size: parseInt(group,10), round_type: 'round',
          special_requests: notes || null
        })
      })
        .then(function(r){ return r.text().then(function(t){ return {ok:r.ok, status:r.status, t:t}; }); })
        .then(function(res){
          btn.disabled=false; btn.textContent='Send Request';
          if(!res.ok){ var e=''; try{e=(JSON.parse(res.t)||{}).error||'';}catch(_){} msg.textContent='Request failed: '+(e||('HTTP '+res.status)); msg.className='msg error'; msg.style.display='block'; return; }
          msg.textContent='Request sent! The concierge team will respond within 24 hours.'; msg.className='msg ok'; msg.style.display='block';
          document.getElementById('course').value=''; document.getElementById('notes').value=''; sel.selectedIndex=0;
          loadRequests();
        })
        .catch(function(){ btn.disabled=false; btn.textContent='Send Request'; msg.textContent='Couldn’t reach the server. Please try again.'; msg.className='msg error'; msg.style.display='block'; });
    }

    // ── List requests for this member ──
    function loadRequests(){
      fetch(API_BASE + '/bookings', { headers: authHeaders() })
        .then(function(r){ return r.ok ? r.json() : {bookings:[]}; })
        .then(function(data){
          var list = Array.isArray(data) ? data : (data.bookings || []);
          var box = document.getElementById('reqList');
          if(!list.length){ box.innerHTML='<div class="empty">No requests yet.</div>'; return; }
          box.innerHTML = list.map(function(b){
            var st = (b.status||'pending').toLowerCase();
            var date = b.preferred_date ? new Date(b.preferred_date + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
            return '<div class="req"><div class="top"><span class="ath">'+escapeHtml(b.athlete_name||'Athlete')+'</span>'+
              '<span class="status st-'+escapeHtml(st)+'">'+escapeHtml(st)+'</span></div>'+
              '<div class="meta">'+escapeHtml(b.course||'')+' · '+date+(b.group_size?(' · party of '+b.group_size):'')+'</div></div>';
          }).join('');
        })
        .catch(function(){ document.getElementById('reqList').innerHTML='<div class="empty">Couldn’t load requests.</div>'; });
    }

    document.getElementById('submitBtn') && document.getElementById('submitBtn').addEventListener('click', submitRequest);
    window.signOut = signOut;
    init();
  </script>
</body>
</html>
